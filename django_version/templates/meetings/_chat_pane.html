<div class="drawer-pane" id="drawer-pane-chat" hidden>
  <div class="drawer-pane-head">
    <h2>In-call chat</h2>
    <p>Messages are visible to everyone in this meeting right now and are not saved after you leave.</p>
  </div>
  <div class="chat-list" id="chat-list" aria-live="polite">
    <p class="ws-empty">No messages yet. Say hello 👋</p>
  </div>
  <form class="chat-form" id="chat-form" autocomplete="off">
    <input type="text" id="chat-input" maxlength="1000" placeholder="Send a message to everyone" aria-label="Chat message" enterkeyhint="send">
    <button type="submit" id="chat-send" title="Send" aria-label="Send message">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>
</div>
