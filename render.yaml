# Render Blueprint: one click deploys the web app, the interpreter (translation) worker, the realtime WebSocket service,
# the Zoom reconciliation cron job, Redis Key Value, and the Postgres database.
# See DEPLOY_RENDER.md. Video itself runs on LiveKit Cloud or Zoom Meeting SDK.
#
# BEFORE you apply this blueprint: Render dashboard > Env Groups > New, name it "wdos-secrets" and add
#   LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET,
#   AZURE_SPEECH_KEY, AZURE_SPEECH_REGION, AZURE_TRANSLATOR_KEY, AZURE_TRANSLATOR_REGION
#   (optional: AZURE_SPEECH_KEY_2, AZURE_TRANSLATOR_KEY_2)
#   ZOOM_ACCOUNT_ID, ZOOM_S2S_CLIENT_ID, ZOOM_S2S_CLIENT_SECRET,
#   ZOOM_SDK_KEY, ZOOM_SDK_SECRET, ZOOM_WEBHOOK_SECRET_TOKEN, ZOOM_FIELD_ENCRYPTION_KEY,
#   REALTIME_WS_URL, REALTIME_ALLOWED_ORIGINS
# All services read the group, so you enter the secrets once.

services:
  # ---- Website + API (Django) -------------------------------------------------------------------------------------
  - type: web
    name: wdos-web
    runtime: python
    region: frankfurt            # closest Render region to West/East/Southern Africa
    plan: standard               # 1 CPU / 2 GB. Move to "pro" if a 1000-person join storm feels slow.
    rootDir: django_version
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn wdos_project.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --threads 8 --worker-class gthread --timeout 60 --access-logfile -
    healthCheckPath: /accounts/login/
    disk:                        # private meeting files; the default disk is wiped on every deploy
      name: wdos-media
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - fromGroup: wdos-secrets
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: DATABASE_URL
        fromDatabase:
          name: wdos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wdos-redis
          property: connectionString

  # ---- Interpreter bot: live captions + spoken translation (LiveKit + Azure) --------------------------------------
  - type: worker
    name: wdos-interpreter
    runtime: python
    region: frankfurt
    plan: standard               # one Python process; "pro" if many people speak at the same time
    rootDir: django_version
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_translation_agent
    envVars:
      - fromGroup: wdos-secrets
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: wdos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wdos-redis
          property: connectionString

  # ---- Realtime WebSocket service (ASGI: Uvicorn + Django Channels) -----------------------------------------------
  - type: web
    name: wdos-realtime
    runtime: python
    region: frankfurt
    plan: standard
    numInstances: 2
    rootDir: django_version
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn wdos_project.asgi:application --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers --ws websockets
    healthCheckPath: /healthz
    envVars:
      - fromGroup: wdos-secrets
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: wdos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wdos-redis
          property: connectionString

  # ---- Zoom reconciliation safety-net cron (every 15 minutes) -----------------------------------------------------
  - type: cron
    name: wdos-zoom-reconcile
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "*/15 * * * *"
    rootDir: django_version
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py zoom_reconcile
    envVars:
      - fromGroup: wdos-secrets
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: wdos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wdos-redis
          property: connectionString

  # ---- Shared Redis Key Value (Channels pub/sub, S2S/ZAK cache, single-use WS nonces, locks) ----------------------
  - type: keyvalue
    name: wdos-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: wdos-db
    databaseName: wdos
    user: wdos
    region: frankfurt
    plan: basic-1gb              # persistent Postgres with backups (the free plan is time-limited, not for production)
